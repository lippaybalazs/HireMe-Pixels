<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HireMe Pixels</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>HireMe Pixels</h1>

        <div id="board-container">
            <div id="board" aria-label="Pixel board"></div>
        </div>
    </main>

    <div id="pixel-dialog" class="hidden">
        <div class="pixel-info">
            <div>
                <span class="label">Position</span>
                <span id="pixel-position"></span>
            </div>

            <div>
                <span class="label">Last edited by</span>
                <span id="pixel-user"></span>
            </div>

            <div>
                <span class="label">Last changed</span>
                <span id="pixel-time"></span>
            </div>
        </div>

        <div class="pixel-editor">
            <input
                type="color"
                id="color-picker"
                value="#FFFFFF"
            >

            <button id="save-button" disabled>Save</button>
        </div>
    </div>

    <div id="login-dialog" class="hidden">
        <div class="login-modal">
            <h2>Login</h2>

            <input
                id="login-username"
                type="text"
                placeholder="Username"
                autocomplete="username"
            >

            <input
                id="login-password"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
            >

            <button id="login-button" type="button">
                Login
            </button>

            <button id="register-button" type="button">
                Register
            </button>

            <div class="login-divider">
                <span>or</span>
            </div>

            <button id="microsoft-login-button" type="button">
                Login with Microsoft
            </button>
        </div>
    </div>

    <button id="logout-button" class="hidden" type="button">
        Logout
    </button>

    <div id="loading-overlay" class="hidden">
        <div class="loading-spinner"></div>
    </div>


    <script src="config.js"></script>
    <script src="app.js"></script>
</body>
</html>
