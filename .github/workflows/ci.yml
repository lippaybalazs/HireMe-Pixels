name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend-check:
    name: Backend / Check
    runs-on: ubuntu-latest
    env:
      PYTHON: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Django check
        working-directory: backend
        run: make check

  backend-test:
    name: Backend / Test
    runs-on: ubuntu-latest
    env:
      PYTHON: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Start backend
        working-directory: backend
        run: make start

      - name: Run tests
        working-directory: backend
        run: make test

  backend-lint:
    name: Backend / Lint
    runs-on: ubuntu-latest
    env:
      PYTHON: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: make lint

  backend-migrations:
    name: Backend / Migrations
    runs-on: ubuntu-latest
    env:
      PYTHON: python

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Check migrations
        working-directory: backend
        run: |
          python manage.py makemigrations --check --dry-run

  kubernetes-integration:
    name: Kubernetes / Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up kind
        uses: helm/kind-action@v1
        with:
          cluster_name: hireme-pixels

      - name: Build Docker images
        run: |
          docker build -t hireme-pixels-backend:latest ./backend
          docker build -t hireme-pixels-frontend:latest ./frontend

      - name: Load images into kind
        run: |
          kind load docker-image hireme-pixels-backend:latest --name hireme-pixels
          kind load docker-image hireme-pixels-frontend:latest --name hireme-pixels

      - name: Deploy application
        run: |
          kubectl apply -f k8s/postgres-secret.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/backend.yaml
          kubectl apply -f k8s/frontend.yaml

      - name: Wait for application
        run: |
          kubectl wait --for=condition=ready pod/postgres-0 --timeout=120s
          kubectl wait --for=condition=available deployment/backend --timeout=120s
          kubectl wait --for=condition=available deployment/frontend --timeout=120s

      - name: Check backend
        run: |
          kubectl port-forward service/backend 8000:8000 &
          sleep 2
          curl --fail http://localhost:8000/api/health/

      - name: Check frontend
        run: |
          kubectl port-forward service/frontend 8080:8080 &
          sleep 2
          curl --fail http://localhost:8080/

      - name: Show resources on failure
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl get services
          kubectl describe pods
          kubectl logs deployment/backend
          kubectl logs deployment/frontend
          kubectl logs postgres-0