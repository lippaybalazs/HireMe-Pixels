name: CD

on:
  push:
    branches:
      - main
      - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      TF_WORKSPACE: ${{ github.ref_name == 'main' && 'development' || 'production' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Apply Foundation
        run: terraform apply -auto-approve -var="deploy_apps=false"

      - name: Get ACR details
        id: acr
        run: |
          echo "name=$(terraform output -raw acr_name)" >> "$GITHUB_OUTPUT"
          echo "login_server=$(terraform output -raw acr_login_server)" >> "$GITHUB_OUTPUT"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "${{ steps.acr.outputs.name }}"

      - name: Build backend image
        working-directory: .
        run: |
          docker build \
            -t "${{ steps.acr.outputs.login_server }}/hireme-pixels-backend:latest" \
            ./backend

      - name: Build frontend image
        working-directory: .
        run: |
          docker build \
            -t "${{ steps.acr.outputs.login_server }}/hireme-pixels-frontend:latest" \
            ./frontend

      - name: Push backend image
        working-directory: .
        run: |
          docker push \
            "${{ steps.acr.outputs.login_server }}/hireme-pixels-backend:latest"

      - name: Push frontend image
        working-directory: .
        run: |
          docker push \
            "${{ steps.acr.outputs.login_server }}/hireme-pixels-frontend:latest"

      - name: Terraform Apply Applications
        run: terraform apply -auto-approve -var="deploy_apps=true -var="deployment_id=${{ github.sha }}"